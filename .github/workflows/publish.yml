name: Publish Extension

on:
  # Trigger when called by the Release workflow after Semantic Release creates a new release
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, SHA or tag) to build from'
        required: false
        type: string
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: false

# Declare default permissions as read only.
permissions:
  contents: read
  actions: read
  attestations: read
  checks: read
  deployments: read
  discussions: read
  issues: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  publish:
    name: Publish to Marketplaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            marketplace.visualstudio.com:443
            open-vsx.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout with specific ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: inputs.ref != ''
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: inputs.ref == ''
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.30.3

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-node-${{ hashFiles('.nvmrc') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: |
          pnpm run compile
          pnpm run webpack

      - name: Package extension
        run: pnpm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: extension-vsix
          path: '*.vsix'
          retention-days: 30

      - name: Publish to VS Code Marketplace
        id: publish-vscode
        continue-on-error: true
        run: pnpm run publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        id: publish-ovsx
        continue-on-error: true
        run: npx ovsx publish *.vsix -p $OVSX_PAT
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Report publish status
        run: |
          echo "## Publish Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.publish-vscode.outcome }}" == "success" ]; then
            echo "✅ VS Code Marketplace: Published successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ VS Code Marketplace: Failed to publish" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.publish-ovsx.outcome }}" == "success" ]; then
            echo "✅ Open VSX Registry: Published successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Open VSX Registry: Failed to publish" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Fail the job if both marketplaces failed
          if [ "${{ steps.publish-vscode.outcome }}" != "success" ] && [ "${{ steps.publish-ovsx.outcome }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Both marketplaces failed to publish" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
