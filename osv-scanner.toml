[[IgnoredVulns]]
id = "GHSA-2g4f-4pwh-qvx6"
reason = """
ajv ReDoS when using the $data option. Affects eslint>ajv (v6.x). Upgrading ajv
to >=8.18.0 (the patched version) is incompatible with @eslint/eslintrc, which
relies on the missingRefs option removed in ajv v8.18.0 and causes ESLint to
crash. The vulnerability is only exploitable when ajv is configured with
$data: true for dynamic schema validation, which ESLint does not do — it uses
ajv solely for internal config schema validation without $data enabled.
"""

[[IgnoredVulns]]
id = "GHSA-3ppc-4f35-3m26"
reason = """
minimatch ReDoS via repeated wildcards. Affects @vscode/vsce and its transitive
dependency glob>minimatch. Upgrading minimatch to >=10.2.1 (the patched version)
is incompatible with @vscode/vsce due to the ESM-only migration in minimatch v10,
which breaks the CommonJS require() calls inside vsce. The vulnerability is only
exploitable when untrusted user input is passed directly as a glob pattern, which
does not occur in this build tooling context.
"""
